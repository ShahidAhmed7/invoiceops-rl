name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --extra openenv
      - name: Lint
        run: uv run ruff check .
      - name: Format
        run: uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Task files are up to date
        run: uv run invoiceops build-tasks --check
      - name: OpenEnv manifest
        run: uv run openenv validate . --level static --skip-build

  containers:
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - name: Install
        run: uv sync --frozen --extra openenv
      - name: Build agent-facing image
        run: docker build -f containers/env.Dockerfile -t invoiceops-env .
      - name: Build verifier image
        run: docker build -f containers/verifier.Dockerfile -t invoiceops-verifier .
      - name: Isolation checks
        run: uv run python scripts/container_check.py
